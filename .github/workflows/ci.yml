name: Python quality gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Keep the same commands a learner can run locally. CI is a repeatable
      # quality gate, not a replacement for understanding the test failures.
      - name: Run pytest suite
        run: pytest -q

      - name: Run Django checks and tests
        run: python manage.py test

      - name: Compile all application modules
        run: python -m compileall -q python_core web_backend django_project fastapi_project flask_project capstone_api tests
